<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b3550"/></marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1b3550">Data Lake HDFS /retail-lake – zones et flux (état au 17/11/2026)</text>

  <!-- Sources -->
  <rect x="20" y="70" width="190" height="150" rx="8" fill="#eef2f5" stroke="#5a6b7b"/>
  <text x="115" y="92" text-anchor="middle" font-weight="bold" fill="#1b3550">Sources locales</text>
  <text x="32" y="116" fill="#1b2733">Kit TPCx-BB (non modifié)</text>
  <text x="32" y="136" font-size="12" fill="#5a6b7b">data/  : 22 fichiers, 959 Mo</text>
  <text x="32" y="154" font-size="12" fill="#5a6b7b">data_refresh/ : 12 fichiers, 9 Mo</text>
  <text x="32" y="180" fill="#1b2733">/data/nifi/input</text>
  <text x="32" y="198" font-size="12" fill="#5a6b7b">copie de travail store.dat</text>

  <!-- Raw -->
  <rect x="260" y="55" width="260" height="235" rx="8" fill="#fff6e8" stroke="#b85c00" stroke-width="2"/>
  <text x="390" y="78" text-anchor="middle" font-weight="bold" fill="#b85c00">raw/  – brut, immuable (444)</text>
  <text x="275" y="104" fill="#1b2733">tpcxbb/initial/&lt;table&gt;/</text>
  <text x="290" y="122" font-size="12" fill="#5a6b7b">21 tables, 22 fichiers ✔ déposés</text>
  <text x="275" y="148" fill="#1b2733">tpcxbb/refresh/&lt;table&gt;/</text>
  <text x="290" y="166" font-size="12" fill="#5a6b7b">12 tables, 12 fichiers ✔ déposés</text>
  <text x="275" y="192" fill="#1b2733">nifi/</text>
  <text x="290" y="210" font-size="12" fill="#5a6b7b">store.dat ✔ déposé par NiFi</text>
  <text x="275" y="240" font-size="12" fill="#1b2733">Contrôle : MD5 local = MD5 HDFS</text>
  <text x="275" y="258" font-size="12" fill="#1b2733">(34/34 OK) · lot + table dans le chemin</text>

  <!-- Bronze Silver Gold -->
  <rect x="570" y="55" width="180" height="70" rx="8" fill="#f1e7da" stroke="#8a6d3b"/>
  <text x="660" y="80" text-anchor="middle" font-weight="bold" fill="#8a6d3b">bronze/tpcxbb</text>
  <text x="660" y="100" text-anchor="middle" font-size="12" fill="#5a6b7b">brut typé + métadonnées</text>
  <text x="660" y="116" text-anchor="middle" font-size="11" fill="#5a6b7b">(J3, créé, vide)</text>
  <rect x="570" y="140" width="180" height="70" rx="8" fill="#eceff1" stroke="#78909c"/>
  <text x="660" y="165" text-anchor="middle" font-weight="bold" fill="#546e7a">silver/</text>
  <text x="660" y="185" text-anchor="middle" font-size="12" fill="#5a6b7b">nettoyé, contrôlé, joint</text>
  <text x="660" y="201" text-anchor="middle" font-size="11" fill="#5a6b7b">(J3, créé, vide)</text>
  <rect x="570" y="225" width="180" height="70" rx="8" fill="#fff8d6" stroke="#c9a400"/>
  <text x="660" y="250" text-anchor="middle" font-weight="bold" fill="#9a7d00">gold/</text>
  <text x="660" y="270" text-anchor="middle" font-size="12" fill="#5a6b7b">KPI, modèle en étoile</text>
  <text x="660" y="286" text-anchor="middle" font-size="11" fill="#5a6b7b">(J3, créé, vide)</text>

  <rect x="800" y="140" width="160" height="70" rx="8" fill="#e6f4f4" stroke="#1d8a8a"/>
  <text x="880" y="170" text-anchor="middle" font-weight="bold" fill="#1d8a8a">BI / métiers</text>
  <text x="880" y="190" text-anchor="middle" font-size="12" fill="#5a6b7b">tableaux de bord</text>

  <!-- transverse -->
  <rect x="260" y="330" width="490" height="60" rx="8" fill="#fdecec" stroke="#b03a3a"/>
  <text x="275" y="355" font-weight="bold" fill="#b03a3a">quality/</text>
  <text x="345" y="355" font-size="12" fill="#1b2733">rapports de contrôle, lignes en quarantaine (séparés des données métier)</text>
  <text x="275" y="377" font-size="12" fill="#5a6b7b">transverse à toutes les zones · alimenté à partir du J3</text>
  <rect x="260" y="405" width="490" height="60" rx="8" fill="#e8eaf6" stroke="#3949ab"/>
  <text x="275" y="430" font-weight="bold" fill="#3949ab">logs/</text>
  <text x="345" y="430" font-size="12" fill="#1b2733">journaux d'ingestion et de traitement (qui, quand, quoi, résultat)</text>
  <text x="275" y="452" font-size="12" fill="#5a6b7b">transverse · traçabilité des exécutions</text>

  <!-- flèches -->
  <line x1="210" y1="125" x2="258" y2="125" stroke="#1b3550" stroke-width="2" marker-end="url(#a)"/>
  <text x="234" y="117" text-anchor="middle" font-size="10" fill="#1b3550">put</text>
  <line x1="210" y1="190" x2="258" y2="200" stroke="#1b3550" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#a)"/>
  <text x="234" y="214" text-anchor="middle" font-size="10" fill="#1b3550">NiFi</text>
  <line x1="520" y1="100" x2="568" y2="90" stroke="#1b3550" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="125" x2="660" y2="138" stroke="#1b3550" stroke-width="2" marker-end="url(#a)"/>
  <line x1="660" y1="210" x2="660" y2="223" stroke="#1b3550" stroke-width="2" marker-end="url(#a)"/>
  <line x1="750" y1="260" x2="840" y2="212" stroke="#1b3550" stroke-width="2" marker-end="url(#a)"/>

  <text x="20" y="500" font-size="12" fill="#1b2733">Trait plein : réalisé au J2 (hdfs dfs -put) · tirets : flux NiFi GetFile → PutHDFS · Bronze → Silver → Gold : prévu au J3 (PySpark).</text>
  <text x="20" y="520" font-size="12" fill="#1b2733">Provenance : chemin = source/lot/table (raw/tpcxbb/initial/store_sales/…), date de modification d'origine conservée (put -p), MD5 consignés,</text>
  <text x="20" y="538" font-size="12" fill="#1b2733">journaux horodatés des dépôts, événements de provenance NiFi (RECEIVE → SEND hdfs://…).</text>
</svg>
